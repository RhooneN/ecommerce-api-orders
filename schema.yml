openapi: 3.0.3
info:
  title: Your Project API
  version: 1.0.0
  description: Your project description
paths:
  /orders/:
    get:
      operationId: orders_list
      tags:
      - orders
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
    post:
      operationId: orders_create
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Order'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /orders/{id}/:
    get:
      operationId: orders_retrieve
      description: Admin-only order management
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
    put:
      operationId: orders_update
      description: Admin-only order management
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Order'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
    patch:
      operationId: orders_partial_update
      description: Admin-only order management
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrder'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
    delete:
      operationId: orders_destroy
      description: Admin-only order management
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      responses:
        '204':
          description: No response body
  /orders/{id}/cancel/:
    put:
      operationId: orders_cancel_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Order'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
    patch:
      operationId: orders_cancel_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrder'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /orders/{id}/delete/:
    delete:
      operationId: orders_delete_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      responses:
        '204':
          description: No response body
  /orders/{signature}/:
    get:
      operationId: orders_retrieve_2
      description: |-
        Retrieve a single order using its UUID.
        Only the owner (or an admin) can access it.
      parameters:
      - in: path
        name: signature
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UOrder'
          description: ''
    put:
      operationId: orders_update_2
      description: |-
        Retrieve a single order using its UUID.
        Only the owner (or an admin) can access it.
      parameters:
      - in: path
        name: signature
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UOrder'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UOrder'
          description: ''
    patch:
      operationId: orders_partial_update_2
      description: |-
        Retrieve a single order using its UUID.
        Only the owner (or an admin) can access it.
      parameters:
      - in: path
        name: signature
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUOrder'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UOrder'
          description: ''
    delete:
      operationId: orders_destroy_2
      description: |-
        Retrieve a single order using its UUID.
        Only the owner (or an admin) can access it.
      parameters:
      - in: path
        name: signature
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      responses:
        '204':
          description: No response body
  /orders/{signature}/status/:
    patch:
      operationId: orders_status_partial_update
      description: Update order status - called by payment service
      parameters:
      - in: path
        name: signature
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrder'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
components:
  schemas:
    Order:
      type: object
      properties:
        total:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        signature:
          type: string
          format: uuid
          readOnly: true
      required:
      - items
      - signature
      - total
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        subtotal:
          type: string
          readOnly: true
      required:
      - id
      - price
      - product_id
      - quantity
      - subtotal
    PatchedOrder:
      type: object
      properties:
        total:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        signature:
          type: string
          format: uuid
          readOnly: true
    PatchedUOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        total:
          type: string
          readOnly: true
    StatusEnum:
      enum:
      - Pending
      - Processing
      - Shipped
      - Confirmed
      - Canceled
      type: string
      description: "* `Pending` - Pending\n* `Processing` - Processing\t\n* `Shipped`
        - Shipped\n* `Confirmed` - Confirmed\n* `Canceled` - Canceled"
    UOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        total:
          type: string
          readOnly: true
      required:
      - created_at
      - id
      - items
      - total
